<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Caçador — auditoria de movimento</title><style>body{margin:20px;background:#202226;color:#eee;font:16px system-ui}canvas{max-width:100%;image-rendering:pixelated}button,select,input{margin:8px;padding:8px}a{color:#ddd}</style><h1>Caçador — Fase B / DEV</h1><p>Master aprovada. Animações candidatas; não integradas no jogo. Caminhada: oito frames por direção, escala fixa por folha e pivô no tronco. NE/NW em revisão de orientação. Candidatos em revisão; sem redimensionamento por frame.</p><select id="state"><option>idle</option><option>walk</option><option>run</option></select><button id="play">Pausar</button><input id="frame" type="range" min="0" max="3" value="0"><span id="info"></span><br><canvas id="audit" width="1536" height="360"></canvas><pre id="findings"></pre><script type="module">
const report=await fetch('./docs/reviews/hunter-motion/audit.json').then(r=>r.json());
const loadImage=src=>new Promise((ok,fail)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=fail;im.src='.'+src;});
const images={};for(const [name,clip] of Object.entries(report.clips)){if(clip.assets){images[name]={};await Promise.all(Object.entries(clip.assets).map(async([dir,path])=>{images[name][dir]=await loadImage(path);}));}else images[name]=await loadImage(clip.asset);}
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),state=document.querySelector('#state'),slider=document.querySelector('#frame');let playing=true,start=performance.now();
window.renderHunterMotion=(name,frame)=>{const clip=report.clips[name];c.fillStyle='#777b80';c.fillRect(0,0,1536,360);c.imageSmoothingEnabled=false;const heights=Object.values(clip.views).flat().map(v=>v.bodyHeight).sort((a,b)=>a-b);const baseScale=205/heights[Math.floor(heights.length/2)];window.hunterMotionGeometry=[];for(let i=0;i<8;i++){const dir=report.directions[i],view=clip.views[dir][frame%clip.frameCount],[sx,sy,w,h]=view.rect,[px,py]=view.pivot,x=96+i*192,baseline=282,scale=clip.scaleByDirection?.[dir]??baseScale;window.hunterMotionGeometry.push({direction:dir,frame,scale,height:view.bodyHeight*scale,baseline,aspectPreserved:true});c.save();c.beginPath();c.rect(i*192,40,192,260);c.clip();c.drawImage(clip.assets?images[name][dir]:images[name],sx,sy,w,h,x-px*scale,baseline-py*scale,w*scale,h*scale);c.restore();c.strokeStyle='#45494d';c.beginPath();c.moveTo(i*192+16,baseline);c.lineTo(i*192+176,baseline);c.stroke();c.fillStyle='#14181c';c.textAlign='center';c.font='bold 17px system-ui';c.fillText(dir,x,312);}c.fillStyle='#14181c';c.textAlign='left';c.font='16px system-ui';c.fillText(`${name.toUpperCase()} v${clip.version??1} · frame ${frame+1}/${clip.frameCount} · DEV / AUDITORIA · escala fixa / sem compensação · sem integração`,20,25);c.fillText('Pivô medido na base da silhueta. Linhas indicam o chão; corrida ainda sem trajetória no mapa.',20,347);return true;};
state.onchange=()=>{slider.max=report.clips[state.value].frameCount-1;start=performance.now();};document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pausar':'Reproduzir';};slider.oninput=()=>{playing=false;};function loop(now){if(window.auditExport){requestAnimationFrame(loop);return;}const clip=report.clips[state.value],frame=playing?Math.floor(Math.max(0,now-start)/1000*clip.fps)%clip.frameCount:Number(slider.value);window.renderHunterMotion(state.value,frame);slider.value=frame;document.querySelector('#info').textContent=`${frame+1}/${clip.frameCount}`;document.querySelector('#findings').textContent=clip.issues.join('\n');requestAnimationFrame(loop);}requestAnimationFrame(loop);window.hunterMotionReady=true;
</script></html>
